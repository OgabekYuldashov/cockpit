*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}

  async function gunzip(u8) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()); }
  function lock() { SK = null; try { document.body.innerHTML = ""; } catch (e) {} location.replace(location.pathname + location.search); }
  function arm() { clearTimeout(idleTimer); if (idleMin > 0) idleTimer = setTimeout(lock, idleMin * 60000); }
  async function enc(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return b64e(iv) + "." + b64e(new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD_STATE }, SK, te.encode(JSON.stringify(obj)))));
  }
  async function dec(v) {
    const [a, b] = v.split(".");
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(a), additionalData: AAD_STATE }, SK, b64d(b))));
  }
  const bundle = { generated: P.generated, olderThanSeen: false };
  const vault = Object.freeze({
    async save(name, obj) { if (SK) localStorage.setItem("ck." + name, await enc(obj)); },
    async load(name) { const v = localStorage.getItem("ck." + name); if (!v || !SK) return null; try { return await dec(v); } catch (e) { return null; } },
    remove(name) { localStorage.removeItem("ck." + name); },
    lock,
    setAutoLock(min) { idleMin = Math.max(0, Number(min) || 0); arm(); },
    get autoLockMinutes() { return idleMin; },
    bundle,
  });
  async function mount(app) {
    const meta = (await vault.load("meta")) || {};
    if (meta.lastGenerated && P.generated < meta.lastGenerated) bundle.olderThanSeen = true;
    else await vault.save("meta", { lastGenerated: P.generated });
    document.title = app.title || "Cockpit";
    for (const [k, v] of Object.entries(app.htmlAttrs || {})) if (k !== "lang") document.documentElement.setAttribute(k, v);
    $("lock-css").remove();
    for (const css of app.css) { const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s); }
    document.body.innerHTML = app.body;
    for (const [k, v] of Object.entries(app.bodyAttrs || {})) document.body.setAttribute(k, v);
    if (bundle.olderThanSeen) {
      const w = document.createElement("div"); w.setAttribute("role", "alert");
      w.textContent = "Warning: this copy is older than one you opened before. Someone may be showing you stale data.";
      w.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;padding:10px 14px;background:#a3261b;color:#fff;font:600 14px system-ui";
      document.body.appendChild(w);
    }
    window.CockpitVault = vault;
    for (const code of app.js) { const s = document.createElement("script"); s.nonce = NONCE; s.textContent = code; document.body.appendChild(s); }
    document.dispatchEvent(new Event("DOMContentLoaded"));
    ["pointerdown", "keydown", "scroll", "touchstart"].forEach((e) => addEventListener(e, arm, { passive: true, capture: true }));
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) hiddenAt = Date.now();
      else if (idleMin > 0 && hiddenAt && Date.now() - hiddenAt > idleMin * 60000) lock();
    });
    addEventListener("pageshow", (e) => { if (e.persisted) lock(); });
    arm();
  }
  $("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pass = $("p").value; if (!pass) return;
    $("go").disabled = true; $("go").textContent = "Unlocking…"; $("err").textContent = "";
    try {
      const keys = await derive(pass);
      const raw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(P.wiv), additionalData: te.encode("cockpit-dek-v2") }, keys.kek, b64d(P.wdek)));
      const dek = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]); raw.fill(0);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(P.iv), additionalData: te.encode("cockpit-v2|" + P.generated) }, dek, b64d(P.ct));
      SK = keys.state;
      $("p").value = "";
      await mount(JSON.parse(new TextDecoder().decode(await gunzip(new Uint8Array(pt)))));
    } catch (e) {
      $("go").disabled = false; $("go").textContent = "Unlock";
      $("err").textContent = "That passphrase did not work. Check it and try again.";
      $("p").select();
    }
  });
  $("p").focus();
})();
</script>
